name: Python tests

on:
  push:
    branches:
      - audit/phase-1-9-remediation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn pytest

      - name: Compile application and source files
        run: python -m compileall -q app.py src pages

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -v --junitxml=pytest-results.xml | tee pytest-output.txt

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-3.14-test-evidence
          path: |
            pytest-results.xml
            pytest-output.txt
          if-no-files-found: ignore
